services:
  - type: web
    name: telegram-group-auto-reply-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        value: "7974865879"
      - key: DATABASE_URL
        sync: false
      - key: GAME_WEBAPP_URL
        fromService:
          type: web
          name: pro-reply-3d-games
          property: host
  - type: web
    name: pro-reply-owner-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python dashboard.py
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: SECRET_KEY
        sync: false

  - type: web
    name: pro-reply-3d-games
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn game_server:app --bind 0.0.0.0:$PORT
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
