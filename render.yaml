services:
  - type: web
    name: telegram-group-auto-reply-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        value: "7974865879"
      - key: DATABASE_URL
        sync: false
  - type: web
    name: pro-reply-owner-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python dashboard.py
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: SECRET_KEY
        sync: false
